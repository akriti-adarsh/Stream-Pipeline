# Infrastructure layer for the streaming pipeline.
# Start:  docker compose --profile core up -d --wait
# Stop:   docker compose --profile core down
#
# Host port map (several defaults are shifted because other local projects
# already occupy 8080, 9000 and 9001 on this machine):
#   Redpanda Kafka API (host clients)   localhost:19092
#   Redpanda Schema Registry (host)     localhost:18081
#   Redpanda HTTP proxy (host)          localhost:18082
#   Redpanda Admin API                  localhost:9644
#   Redpanda Console UI                 localhost:18080
#   Postgres (5432 inside container)    localhost:5433
#   MinIO S3 API                        localhost:19000
#   MinIO web console                   localhost:19001
#
# From other containers on the "pipeline" network use:
#   redpanda:9092 (Kafka), redpanda:8081 (schema registry),
#   postgres:5432, minio:9000

name: stream-pipeline

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.3.15
    profiles: ["core", "full"]
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --overprovisioned
      # internal listener for containers, external listener for host clients
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "19092:19092" # Kafka API for host clients
      - "18081:18081" # Schema Registry for host clients
      - "18082:18082" # HTTP proxy for host clients
      - "9644:9644"   # Admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - pipeline
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s

  console:
    image: docker.redpanda.com/redpandadata/console:v3.8.0
    profiles: ["core", "full"]
    depends_on:
      redpanda:
        condition: service_healthy
      # also gates on the one-shot bucket-init: compose "up --wait" only
      # accepts a one-shot exiting 0 when some service depends on it with
      # service_completed_successfully, otherwise --wait returns exit 1
      bucket-init:
        condition: service_completed_successfully
    environment:
      CONFIG_FILEPATH: /etc/console/config.yml
    volumes:
      - ./infra/console/console-config.yml:/etc/console/config.yml:ro
    ports:
      - "18080:8080" # Console UI (8080 on this host is taken by another project)
    networks:
      - pipeline
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  postgres:
    image: postgres:16.14-alpine
    profiles: ["core", "full"]
    environment:
      POSTGRES_USER: stream
      POSTGRES_PASSWORD: stream
      POSTGRES_DB: stream
    ports:
      - "5433:5432" # host 5433 because 5432 is taken on this machine
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - pipeline
    healthcheck:
      # -h 127.0.0.1 forces TCP so the temporary init-time server (unix socket
      # only) cannot produce a false healthy signal
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U stream -d stream"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["core", "full"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "19000:9000" # S3 API (9000 on this host is taken by another project)
      - "19001:9001" # web console (9001 on this host is taken by another project)
    volumes:
      - minio-data:/data
    networks:
      - pipeline
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 5s

  # one-shot: creates the buckets, then exits 0 (idempotent, safe to rerun)
  bucket-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: ["core", "full"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/lakehouse &&
        mc mb --ignore-existing local/warehouse &&
        mc ls local
    networks:
      - pipeline
    restart: "no"

networks:
  pipeline:
    name: pipeline

volumes:
  redpanda-data:
  postgres-data:
  minio-data:
