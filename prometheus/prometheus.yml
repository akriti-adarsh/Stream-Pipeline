# Prometheus scrape config for the stream-pipeline observability layer.
#
# Every Python service can run in two homes and each job lists both targets:
# the compose SERVICE NAME (the containerised platform, the normal case) and
# host.docker.internal (a processor started on the host with uv during
# development or a kill test). Only whichever is alive answers; the dead twin
# shows as a down target, which the dashboard's targets table makes obvious.
# The TargetDown alert therefore keys on the sp_up heartbeat rather than the
# raw `up` metric, so a vacant secondary home never pages anyone.
# Port conventions live in src/common/metrics.py:
#   generator 9101, sessionizer 9102, pg-sink 9103, iceberg-sink 9104,
#   lag-exporter 9105, dq-runner 9109.

global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: generator
    static_configs:
      - targets: ["generator:9101"]
        labels: {home: container}
      - targets: ["host.docker.internal:9101"]
        labels: {home: host}
  - job_name: sessionizer
    static_configs:
      - targets: ["sessionizer:9102"]
        labels: {home: container}
      - targets: ["host.docker.internal:9102"]
        labels: {home: host}
  - job_name: pg-sink
    static_configs:
      - targets: ["pg-sink:9103"]
        labels: {home: container}
      - targets: ["host.docker.internal:9103"]
        labels: {home: host}
  - job_name: iceberg-sink
    static_configs:
      - targets: ["iceberg-sink:9104"]
        labels: {home: container}
      - targets: ["host.docker.internal:9104"]
        labels: {home: host}
  - job_name: lag-exporter
    static_configs:
      - targets: ["lag-exporter:9105"]
        labels: {home: container}
      - targets: ["host.docker.internal:9105"]
        labels: {home: host}
  - job_name: dq-runner
    static_configs:
      - targets: ["dq-runner:9109"]
        labels: {home: container}
      - targets: ["host.docker.internal:9109"]
        labels: {home: host}
