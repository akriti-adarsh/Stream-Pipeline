# Alerting rules for the stream-pipeline observability layer.
# Loaded via rule_files in prometheus.yml; inspect at /api/v1/rules.

groups:
  - name: pipeline-health
    rules:
      - alert: ConsumerLagHigh
        expr: sp_consumer_lag > 1000
        for: 2m
        labels:
          severity: page
        annotations:
          summary: >-
            Consumer lag high for group {{ $labels.group }} on
            {{ $labels.topic }}[{{ $labels.partition }}]
          description: >-
            Group {{ $labels.group }} is {{ $value }} messages behind the end
            of {{ $labels.topic }} partition {{ $labels.partition }} and has
            been for 2 minutes. Check the consumer process (ports and
            services are documented in src/common/metrics.py) and the
            pipeline-health Grafana dashboard.

      - alert: TargetDown
        # Every job lists two homes (container service name and
        # host.docker.internal); a service is down only when NEITHER answers.
        expr: max by (job) (up) == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Service {{ $labels.job }} is down in every home"
          description: >-
            Prometheus could not scrape {{ $labels.job }} at any of its
            targets for 2 minutes. Services only serve metrics while running
            with METRICS_PORT set, so this either means the process died or
            it was started without metrics enabled.
